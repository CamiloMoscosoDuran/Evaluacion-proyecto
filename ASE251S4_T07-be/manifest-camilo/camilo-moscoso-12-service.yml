# kubectl apply -f camilo-moscoso-12-service.yml
# kubectl delete -f camilo-moscoso-12-service.yml
apiVersion: v1
kind: Service
metadata:
  name: camilo-moscoso-12-service
  namespace: camilo-moscoso-12-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8082  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: camilo-moscoso-12-deployment  # Debe coincidir con las etiquetas del Deployment