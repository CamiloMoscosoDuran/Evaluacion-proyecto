# kubectl apply -f camilo-moscoso-12-deployment.yml
# kubectl delete -f camilo-moscoso-12-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camilo-moscoso-12-deployment
  namespace: camilo-moscoso-12-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camilo-moscoso-12-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: camilo-moscoso-12-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: camilo-moscoso-12-container
        image: camilomoscoso/s5-springwebflux-mongodb   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: Always        # IfNotPresent | Always Evitar traer siempre la última versión si hay una actual
        ports:
        - containerPort: 8082
        envFrom:
        - secretRef:
            name: camilo-moscoso-12-secret  # Esto cargará todos los valores del Secret como variables de entorno
        #- configMapRef:
        #    name: camilo-moscoso-12-configmap # Esto cargará todos los valores del ConfigMap como variables de entorno