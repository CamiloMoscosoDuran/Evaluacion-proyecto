name: Docker Hub - Medalid

on:
  push:
    branches:
      - develop
      - webflux-nosql
  pull_request:
    branches:
      - develop
      - webflux-nosql
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push AgroTecno Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_MEDALID }}
          password: ${{ secrets.DOCKERHUB_TOKEN_MEDALID }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile-medalid/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            medalidcondezo/agrotecno-webflux:latest
            medalidcondezo/agrotecno-webflux:${{ github.sha }}
