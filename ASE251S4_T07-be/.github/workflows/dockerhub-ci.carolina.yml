name: Docker Hub

on:
  push:
    branches:
      - develop # puedes añadir más ramas
      - webflux-nosql
  pull_request:
    branches:
      - develop # puedes añadir más ramas
      - webflux-nosql
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login a Docker Hub (Actualizado de @v1 a @v4)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_CAROLINA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_CAROLINA }}

      # 3. Build y Push con tags latest y SHA (Actualizado de @v4 a @v7)
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          #dockerfile: Dockerfile   # Dockerfile en la raíz del proyecto
          file: ./dockerfile-carolina/Dockerfile        # Dockerfile en la carpeta dockerfile-carolina
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_CAROLINA }}/s11-spring-webflux:latest
            ${{ secrets.DOCKERHUB_USERNAME_CAROLINA }}/s11-spring-webflux:${{ github.sha }}

# CI PIPELINE GITHUB + DOCKERHUB
