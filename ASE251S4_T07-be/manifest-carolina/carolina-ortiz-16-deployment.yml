# kubectl apply -f carolina-ortiz-16-deployment.yml
# kubectl delete -f carolina-ortiz-16-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carolina-ortiz-16-deployment
  namespace: carolina-ortiz-16-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carolina-ortiz-16-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: carolina-ortiz-16-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: carolina-ortiz-16-container
        image: carolinaortiz/s5-springwebflux-mongodb:latest   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: Always        # IfNotPresent | Always Evitar traer siempre la última versión si hay una actual
        envFrom:
        - secretRef:
            name: carolina-ortiz-16-secret  # Esto cargará todos los valores del Secret como variables de entorno
        #- configMapRef:
        #    name: carolina-ortiz-16-configmap # Esto cargará todos los valores del ConfigMap como variables de entorno