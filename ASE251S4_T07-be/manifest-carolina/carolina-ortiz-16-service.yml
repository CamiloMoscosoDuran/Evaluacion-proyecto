# kubectl apply -f carolina-ortiz-16-service.yml
# kubectl delete -f carolina-ortiz-16-service.yml
apiVersion: v1
kind: Service
metadata:
  name: carolina-ortiz-16-service
  namespace: carolina-ortiz-16-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8082  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: carolina-ortiz-16-deployment  # Debe coincidir con las etiquetas del Deployment